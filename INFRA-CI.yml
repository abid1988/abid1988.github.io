trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

# ==================================================
# DEV PLAN
# ==================================================

stages:

- stage: DEV_PLAN
  displayName: 'DEV - Terraform Plan'

  jobs:
  - job: DevTerraformPlan
    displayName: 'DEV Terraform Validation and Plan'

    pool:
      vmImage: ubuntu-latest

    steps:

    # --------------------------------------------------
    # Checkout
    # --------------------------------------------------

    - checkout: self
      displayName: 'Checkout Source Code'


    # --------------------------------------------------
    # Build Information
    # --------------------------------------------------

    - script: |
        echo "========================================="
        echo "DEV Terraform CI"
        echo "========================================="
        echo "Repository: $(Build.Repository.Name)"
        echo "Branch: $(Build.SourceBranch)"
        echo "Commit: $(Build.SourceVersion)"
        echo "Build ID: $(Build.BuildId)"
      displayName: 'Display Build Information'


    # --------------------------------------------------
    # Install Terraform
    # --------------------------------------------------

    - script: |
        set -e

        TERRAFORM_VERSION="1.15.6"

        echo "Installing Terraform ${TERRAFORM_VERSION}..."

        wget -q \
          https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip

        unzip -o terraform_${TERRAFORM_VERSION}_linux_amd64.zip

        sudo mv terraform /usr/local/bin/terraform

        terraform version
      displayName: 'Install Terraform'


    # --------------------------------------------------
    # Format Check
    # --------------------------------------------------

    - script: |
        cd infrastructure/dev
        terraform fmt -check
      displayName: 'Terraform Format Check - DEV'


    # --------------------------------------------------
    # Init + Validate + Plan
    # --------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Init Validate Plan - DEV'

      inputs:
        azureSubscription: 'ado-svc'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'

        inlineScript: |

          set -e

          echo "========================================="
          echo "DEV - Azure Authentication"
          echo "========================================="

          az account show \
            --query "{Subscription:name, SubscriptionId:id, TenantId:tenantId}" \
            --output table

          cd infrastructure/dev

          echo ""
          echo "========================================="
          echo "DEV - Terraform Init"
          echo "========================================="

          terraform init

          echo ""
          echo "========================================="
          echo "DEV - Terraform Validate"
          echo "========================================="

          terraform validate

          echo ""
          echo "========================================="
          echo "DEV - Terraform Plan"
          echo "========================================="

          terraform plan -out=tfplan

          echo ""
          echo "DEV Terraform plan created successfully."


    # --------------------------------------------------
    # Publish DEV Plan
    # --------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: 'Publish DEV Terraform Plan'

      inputs:
        targetPath: 'infrastructure/dev/tfplan'
        artifact: 'terraform-plan-dev'
        publishLocation: 'pipeline'


# ==================================================
