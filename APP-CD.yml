trigger: none
pr: none

resources:
  pipelines:
    - pipeline: appCI
      source: Application-CI
      trigger:
        branches:
          include:
            - main

pool:
  vmImage: ubuntu-latest

stages:

- stage: DEV_DEPLOY
  displayName: Deploy Application to DEV

  jobs:

  - job: DeployDev
    displayName: Deploy Portfolio to DEV Web App

    steps:

    - checkout: self

    - download: appCI
      artifact: portfolio-app

    - task: AzureCLI@2
      displayName: Deploy Application ZIP to DEV
      inputs:
        azureSubscription: 'ado-svc'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Deploying portfolio application to DEV..."

          az webapp deploy \
            --resource-group rg-syed-portfolio-dev \
            --name app-syed-portfolio-dev \
            --src-path "$(Pipeline.Workspace)/appCI/portfolio-app/portfolio-app.zip" \
            --type zip

          echo "DEV deployment completed."

    - script: |
        echo "Validating DEV application..."

        URL="https://abid.b18g78.online"

        for i in {1..10}; do
          HTTP_STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" "$URL")

          echo "Attempt $i - HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "DEV application is healthy."
            exit 0
          fi

          echo "Application not ready yet. Retrying in 15 seconds..."
          sleep 15
        done

        echo "DEV application health validation failed after multiple attempts."
        exit 1
      displayName: Validate DEV Deployment