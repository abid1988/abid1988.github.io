trigger: none
pr: none

resources:
  pipelines:
    - pipeline: appCI
      source: Application-CI
      trigger:
        branches:
          include:
            - main

pool:
  vmImage: ubuntu-latest

stages:

- stage: DEV_DEPLOY
  displayName: Deploy Application to DEV

  jobs:

  - job: DeployDev
    displayName: Deploy Portfolio to DEV Web App

    steps:

    - checkout: self

    - download: appCI
      artifact: portfolio-app

    - task: AzureCLI@2
      displayName: Deploy Application ZIP to DEV
      inputs:
        azureSubscription: 'ado-svc'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Deploying portfolio application to DEV..."

          az webapp deploy \
            --resource-group rg-syed-portfolio-dev \
            --name app-syed-portfolio-dev \
            --src-path "$(Pipeline.Workspace)/appCI/portfolio-app/portfolio-app.zip" \
            --type zip

          echo "DEV deployment completed."

    - script: |
        echo "Validating DEV application..."

        URL="https://app-syed-portfolio-dev-bhdpfyfybrfza4fr.centralindia-01.azurewebsites.net"

        for i in {1..10}; do

          echo "Health check attempt $i..."

          HTTP_STATUS=$(curl \
            --location \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --output /dev/null \
            --write-out "%{http_code}" \
            "$URL" || true)

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "DEV application is healthy."
            exit 0
          fi

          echo "Application not ready. Retrying in 15 seconds..."
          sleep 15
        done

        echo "DEV application health validation failed."
        exit 1

      displayName: Validate DEV Deployment


- stage: QA_DEPLOY
  displayName: Deploy Application to QA
  dependsOn: DEV_DEPLOY

  jobs:

  - job: DeployQA
    displayName: Deploy Portfolio to QA Web App

    steps:

    - checkout: self

    - download: appCI
      artifact: portfolio-app

    - task: AzureCLI@2
      displayName: Deploy Application ZIP to QA
      inputs:
        azureSubscription: 'ado-svc'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Deploying portfolio application to QA..."

          az webapp deploy \
            --resource-group rg-syed-portfolio-qa \
            --name app-syed-portfolio-qa \
            --src-path "$(Pipeline.Workspace)/appCI/portfolio-app/portfolio-app.zip" \
            --type zip

          echo "QA deployment completed."

    - script: |
        echo "Validating QA application..."

        URL="https://app-syed-portfolio-qa-gaf9e3c5gjf2aua4.centralindia-01.azurewebsites.net"

        for i in {1..10}; do

          echo "Health check attempt $i..."

          HTTP_STATUS=$(curl \
            --location \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --output /dev/null \
            --write-out "%{http_code}" \
            "$URL" || true)

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "QA application is healthy."
            exit 0
          fi

          echo "Application not ready. Retrying in 15 seconds..."
          sleep 15
        done

        echo "QA application health validation failed."
        exit 1

      displayName: Validate QA Deployment