# ==================================================
# PROD DEPLOY
# ==================================================

- stage: PROD_DEPLOY
  displayName: 'PROD - Terraform Apply'

  dependsOn: QA_DEPLOY
  condition: succeeded()

  jobs:

  - deployment: DeployProd
    displayName: 'Deploy PROD Infrastructure'

    environment: 'PROD'

    pool:
      vmImage: ubuntu-latest

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self
            displayName: 'Checkout Source Code'


          - script: |
              set -e

              TERRAFORM_VERSION="1.15.6"

              echo "Installing Terraform ${TERRAFORM_VERSION}..."

              wget -q \
                https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip

              unzip -o terraform_${TERRAFORM_VERSION}_linux_amd64.zip

              sudo mv terraform /usr/local/bin/terraform

              terraform version
            displayName: 'Install Terraform'


          - download: infraCI
            artifact: terraform-plan-prod
            displayName: 'Download PROD Terraform Plan'


          - script: |
              echo "========================================="
              echo "PROD Terraform Plan Artifact"
              echo "========================================="

              ls -la $(Pipeline.Workspace)/infraCI/terraform-plan-prod
            displayName: 'Inspect PROD Terraform Plan'


          - task: AzureCLI@2
            displayName: 'Terraform Apply - PROD'

            inputs:
              azureSubscription: 'ado-svc'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'

              inlineScript: |

                set -e

                echo "========================================="
                echo "PROD - Azure Authentication"
                echo "========================================="

                az account show \
                  --query "{Subscription:name, SubscriptionId:id, TenantId:tenantId}" \
                  --output table

                cd infrastructure/prod

                echo ""
                echo "========================================="
                echo "PROD - Terraform Init"
                echo "========================================="

                terraform init

                echo ""
                echo "========================================="
                echo "PROD - Terraform Apply"
                echo "========================================="

                terraform apply -auto-approve \
                  $(Pipeline.Workspace)/infraCI/terraform-plan-prod/tfplan

                echo ""
                echo "PROD Infrastructure Deployment Completed"