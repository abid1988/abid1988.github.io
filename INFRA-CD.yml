trigger: none

pr: none

resources:
  pipelines:
    - pipeline: infraCI
      source: 'Terraform-Infrastructure-CI'
      trigger: none

# ==================================================
# MULTI-ENVIRONMENT TERRAFORM CD
# ==================================================

stages:

# ==================================================
# DEV DEPLOY
# ==================================================

- stage: DEV_DEPLOY
  displayName: 'DEV - Terraform Apply'

  jobs:

  - job: DeployDev
    displayName: 'Deploy DEV Infrastructure'

    pool:
      vmImage: ubuntu-latest

    steps:

    - checkout: self
      displayName: 'Checkout Source Code'


    - script: |
        set -e

        TERRAFORM_VERSION="1.15.6"

        echo "Installing Terraform ${TERRAFORM_VERSION}..."

        wget -q \
          https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip

        unzip -o terraform_${TERRAFORM_VERSION}_linux_amd64.zip

        sudo mv terraform /usr/local/bin/terraform

        terraform version
      displayName: 'Install Terraform'


    - download: infraCI
      artifact: terraform-plan-dev
      displayName: 'Download DEV Terraform Plan'


    - script: |
        echo "========================================="
        echo "DEV Terraform Plan Artifact"
        echo "========================================="

        ls -la $(Pipeline.Workspace)/infraCI/terraform-plan-dev
      displayName: 'Inspect DEV Terraform Plan'


    - task: AzureCLI@2
      displayName: 'Terraform Apply - DEV'

      inputs:
        azureSubscription: 'ado-svc'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'

        inlineScript: |

          set -e

          echo "========================================="
          echo "DEV - Azure Authentication"
          echo "========================================="

          az account show \
            --query "{Subscription:name, SubscriptionId:id, TenantId:tenantId}" \
            --output table

          cd infrastructure/dev

          echo ""
          echo "========================================="
          echo "DEV - Terraform Init"
          echo "========================================="

          terraform init

          echo ""
          echo "========================================="
          echo "DEV - Terraform Apply"
          echo "========================================="

          terraform apply -auto-approve \
            $(Pipeline.Workspace)/infraCI/terraform-plan-dev/tfplan

          echo ""
          echo "DEV Infrastructure Deployment Completed"


