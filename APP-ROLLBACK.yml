trigger: none
pr: none

# =========================================================
# Rollback Parameters
# =========================================================

parameters:

- name: buildId
  displayName: Application-CI Build ID to Rollback
  type: string
  default: '86'


# =========================================================
# Self-Hosted Windows Agent
# =========================================================

pool:
  name: ADO-Agent


steps:

# =========================================================
# Validate Rollback Request
# =========================================================

- powershell: |
    Write-Host "===== APPLICATION ROLLBACK ====="
    Write-Host "Target Environment     : DEV"
    Write-Host "Application-CI Build ID: ${{ parameters.buildId }}"

    if ([string]::IsNullOrWhiteSpace("${{ parameters.buildId }}")) {
      Write-Error "Application-CI Build ID is required."
      exit 1
    }

    Write-Host "Rollback request validated successfully."

  displayName: Validate Rollback Request


# =========================================================
# Download Previous Application Artifact
# =========================================================

- task: DownloadPipelineArtifact@2
  displayName: Download Previous Application Artifact
  inputs:
    buildType: specific
    project: '$(System.TeamProject)'
    definition: 'Application-CI'
    buildVersionToDownload: specific
    pipelineId: '${{ parameters.buildId }}'
    artifactName: 'portfolio-app'
    targetPath: '$(Pipeline.Workspace)\rollback'


# =========================================================
# Verify Downloaded Rollback Artifact
# =========================================================

- powershell: |
    Write-Host "===== VERIFY ROLLBACK ARTIFACT ====="

    $artifactPath = "$(Pipeline.Workspace)\rollback\portfolio-app.zip"

    Write-Host "Expected artifact:"
    Write-Host $artifactPath

    if (-not (Test-Path $artifactPath)) {
      Write-Error "Rollback artifact portfolio-app.zip was not found."
      exit 1
    }

    Write-Host "Rollback artifact successfully downloaded."

    Get-Item $artifactPath | Format-List Name, Length, LastWriteTime

  displayName: Verify Rollback Artifact


# =========================================================
# Deploy Previous Artifact to DEV
# =========================================================

- task: AzureCLI@2
  displayName: Rollback Application in DEV
  inputs:
    azureSubscription: 'ado-svc'
    scriptType: ps
    scriptLocation: inlineScript
    inlineScript: |
      Write-Host "===== DEV APPLICATION ROLLBACK ====="

      $artifactPath = "$(Pipeline.Workspace)\rollback\portfolio-app.zip"

      Write-Host "Deploying Application-CI Build ID:"
      Write-Host "${{ parameters.buildId }}"

      Write-Host "Artifact:"
      Write-Host $artifactPath

      az webapp deploy `
        --resource-group rg-syed-portfolio-dev `
        --name app-syed-portfolio-dev `
        --src-path "$artifactPath" `
        --type zip

      if ($LASTEXITCODE -ne 0) {
        Write-Error "DEV rollback deployment failed."
        exit $LASTEXITCODE
      }

      Write-Host "Previous application artifact successfully deployed to DEV."


# =========================================================
# Post-Rollback Health Validation
# =========================================================

- powershell: |
    Write-Host "===== POST-ROLLBACK HEALTH VALIDATION ====="

    $url = "https://app-syed-portfolio-dev-bhdpfyfybrfza4fr.centralindia-01.azurewebsites.net"

    Write-Host "Health Check URL:"
    Write-Host $url

    for ($i = 1; $i -le 10; $i++) {

      Write-Host ""
      Write-Host "Health check attempt $i..."

      try {

        $response = Invoke-WebRequest `
          -Uri $url `
          -UseBasicParsing `
          -TimeoutSec 20

        $httpStatus = $response.StatusCode

      }
      catch {

        $httpStatus = 0
        Write-Host "Application is not ready yet."
      }

      Write-Host "HTTP Status: $httpStatus"

      if ($httpStatus -eq 200) {

        Write-Host ""
        Write-Host "=========================================="
        Write-Host "APPLICATION ROLLBACK SUCCESSFUL"
        Write-Host "Build ID    : ${{ parameters.buildId }}"
        Write-Host "Environment : DEV"
        Write-Host "HTTP Status : 200"
        Write-Host "=========================================="

        exit 0
      }

      Write-Host "Retrying in 15 seconds..."
      Start-Sleep -Seconds 15
    }

    Write-Error "Post-rollback health validation failed."
    exit 1

  displayName: Validate DEV After Rollback