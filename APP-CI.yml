trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:

- stage: BUILD
  displayName: Application CI

  jobs:

  - job: BuildApplication
    displayName: Validate and Package Portfolio

    steps:

    # Checkout application source code
    - checkout: self

    # Validate required application files and directories
    - script: |
        echo "Validating required application files..."

        test -f index.html
        test -f style.css
        test -f script.js
        test -d images
        test -d assets

        echo "Application validation successful."
      displayName: Validate Application Files

    # Prepare only application files for deployment
    - script: |
        echo "Preparing application package..."

        mkdir -p $(Build.ArtifactStagingDirectory)/app

        cp index.html $(Build.ArtifactStagingDirectory)/app/
        cp style.css $(Build.ArtifactStagingDirectory)/app/
        cp script.js $(Build.ArtifactStagingDirectory)/app/

        cp -r images $(Build.ArtifactStagingDirectory)/app/
        cp -r assets $(Build.ArtifactStagingDirectory)/app/

        echo "Application package prepared."
      displayName: Prepare Application Package

    # Create ZIP package
    - task: ArchiveFiles@2
      displayName: Create Application ZIP
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/app'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/portfolio-app.zip'
        replaceExistingArchive: true

    # Publish ZIP as pipeline artifact
    - task: PublishPipelineArtifact@1
      displayName: Publish Application Artifact
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/portfolio-app.zip'
        artifact: 'portfolio-app'
        publishLocation: pipeline