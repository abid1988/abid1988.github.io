trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:

# --------------------------------------------------
# 1. Checkout Source Code
# --------------------------------------------------

- checkout: self

# --------------------------------------------------
# 2. Display Build Information
# --------------------------------------------------

- script: |
    echo "================================="
    echo "CI Pipeline Started"
    echo "================================="
    echo "Repository: $(Build.Repository.Name)"
    echo "Branch: $(Build.SourceBranch)"
    echo "Commit: $(Build.SourceVersion)"
    echo "Build ID: $(Build.BuildId)"
  displayName: 'Display Build Information'

# --------------------------------------------------
# 3. Validate Application
# --------------------------------------------------

- script: |
    echo "Validating application files..."

    test -f index.html
    test -f style.css
    test -f script.js

    echo "Application validation successful."
  displayName: 'Validate Application Files'

# --------------------------------------------------
# 4. Create Application Package
# --------------------------------------------------

- script: |
    echo "Creating application package..."

    mkdir -p $(Build.ArtifactStagingDirectory)/portfolio-app

    cp index.html $(Build.ArtifactStagingDirectory)/portfolio-app/
    cp style.css $(Build.ArtifactStagingDirectory)/portfolio-app/
    cp script.js $(Build.ArtifactStagingDirectory)/portfolio-app/

    if [ -d "images" ]; then
      cp -r images $(Build.ArtifactStagingDirectory)/portfolio-app/
    fi

    echo "Application package created."
    ls -la $(Build.ArtifactStagingDirectory)/portfolio-app
  displayName: 'Package Application'

# --------------------------------------------------
# 5. Create ZIP
# --------------------------------------------------

- script: |
    cd $(Build.ArtifactStagingDirectory)

    zip -r portfolio-app.zip portfolio-app

    echo "Created artifact:"
    ls -lh portfolio-app.zip
  displayName: 'Create Application ZIP'

# --------------------------------------------------
# 6. Publish Artifact
# --------------------------------------------------

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/portfolio-app.zip'
    artifact: 'portfolio-app'
    publishLocation: 'pipeline'
  displayName: 'Publish Application Artifact'
